# Install torch etc. or use our docker image and clone this repo
# pip install -e . --no-build-isolation
# To rebuild the C env:
# python setup.py build_arkhai --inplace --force
# Training:
# python -m pufferlib.pufferl train puffer_arkhai
# Sweeps:
# python -m pufferlib.pufferl sweep puffer_arkhai --<neptune/wandb> --tag <sweep name>
# We now suggest WandB. OpenAI bought neptune and is shutting it down soon.
# Note: this is all the same as the docs. No difference for your env w/ current 3.0
# C test:
# bash scripts/build_ocean.sh arkhai <local/fast>
# ./arkhai

[base]
package = ocean
env_name = puffer_arkhai
policy_name = Policy
rnn_name = Recurrent

[env]
# This is the number of environment simulated per worker/core
num_envs = 1024

# Anything set here will be passed to the ocean/arkhai/arkhai.py via **kwargs and
# then through ocean/arkhai/binding.c into the env.
ai_sellers = 1
ai_buyers = 0
scripted_sellers = 0
scripted_buyers = 1
episode_length = 100
request_timeout = 5
job_a100_nodes = 1
job_a100_nodes_dr = 0.0
job_h100_nodes = 1
job_h100_nodes_dr = 0.0
job_r5090_nodes = 1
job_r5090_nodes_dr = 0.0
job_gh200_nodes = 0
job_gh200_nodes_dr = 0.0
job_gb200_nodes = 0
job_gb200_nodes_dr = 0.0
job_duration = 10
job_duration_dr = 0.0
job_tb_usage = 0.0
job_tb_usage_dr = 0.0
job_efficiency = 1.0
job_efficiency_dr = 0.0
scripted_buy_price = 1.0
scripted_buy_price_dr = 0.0
scripted_sell_price = 1.0
scripted_sell_price_dr = 0.0
# Need 0.1 for energy trading, 0.001 for compute allocation
# The small energy reward gets washed out by the large compute reward
reward_scale = 0.0001
tb_price = 0.03
a100_price = 5.0
a100_kw = 6.5
h100_price = 5.0
h100_kw = 10.0
r5090_price = 0.0
r5090_kw = 1.0
# Approximate 8x GPU pod-equivalent hourly rates and power.
gh200_price = 0.0
gh200_kw = 10.0
gb200_price = 0.0
gb200_kw = 13.3
energy_demand_base = 0.0
# Residential price for testing energy optimization
kwh_price_base = 1.0
kwh_price_sensitivity = 0.0
kwh_demand_threshold = 0
a1 = 0
b1 = 0
a2 = 0
b2 = 0
a3 = 0
b3 = 0

# Randomizes the tick on the first reset.
randomize_offset = 0

# Unused. Might be good to have a way to enable preset test configs.
preset = 0

cluster_a100_capacity = 0
cluster_a100_capacity_dr = 0.0
cluster_h100_capacity = 0
cluster_h100_capacity_dr = 0.0
cluster_r5090_capacity = 0
cluster_r5090_capacity_dr = 0.0
cluster_gh200_capacity = 0
cluster_gh200_capacity_dr = 0.0
cluster_gb200_capacity = 0
cluster_gb200_capacity_dr = 0.0
cluster_tb_capacity = 10000
cluster_tb_capacity_dr = 0.0
cluster_kwh_capacity = 10
cluster_kwh_capacity_dr = 0.0
cluster_kw_generation = 1
cluster_kw_generation_dr = 0.0

# 5090 test config
#scripted_buy_price = 1.0
#scripted_buy_price_dr = 0.0
#job_duration = 100
